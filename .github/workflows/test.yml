name: test
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version check through the action
        uses: ./
        with:
          args: --version
  rejects-bad-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          version: "0.0.7; echo pwned"
          args: --version
      - name: Expect failure
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: test "$OUTCOME" = failure
